version: '3.9'

services:

  # ============================================================
  # BACKEND — Node.js + Express
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kamwalaa-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-https://kamwalaa.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - kamwalaa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # POSTGRES — Primary Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: kamwalaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       kamwalaa_db
      POSTGRES_USER:     kamwalaa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration_v1_initial.sql:/docker-entrypoint-initdb.d/01_initial.sql
      - ./db/migration_v2_enterprise.sql:/docker-entrypoint-initdb.d/02_enterprise.sql
    ports:
      - "5432:5432"
    networks:
      - kamwalaa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamwalaa -d kamwalaa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # REDIS — Cache, Sessions, Rate Limiting, Pub/Sub
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: kamwalaa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - kamwalaa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # NGINX — Reverse Proxy + SSL Termination
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: kamwalaa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - kamwalaa-net

  # ============================================================
  # CERTBOT — Auto SSL (Let's Encrypt)
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: kamwalaa-certbot
    volumes:
      - ./docker/ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ============================================================
# VOLUMES
# ============================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  certbot-www:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  kamwalaa-net:
    driver: bridge
